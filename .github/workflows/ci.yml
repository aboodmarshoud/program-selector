name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check (lint)
        run: npm run lint
      - name: Recommendation scenarios
        run: npm run test:scenarios
      - name: Build
        run: npm run build
